name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check -- --pack
      - name: Obsidian community scanner checks
        uses: obsidianmd/obsidian-workflows@8167caed39664214d82c86fdfa32e06d8d55f61d # v1
        with:
          mode: pr
          build: 'false'
          scanner-lint: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: artifacts/*
          if-no-files-found: error
