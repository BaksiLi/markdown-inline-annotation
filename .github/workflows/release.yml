name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release tag
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          assert.equal(process.env.GITHUB_REF_TYPE, "tag");
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);
          NODE
      - run: npm ci
      - run: npm run check
      - name: Package extension
        run: npx --yes @vscode/vsce@4 package
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
      - name: Sign in to Microsoft Entra ID
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish the packaged extension to Marketplace
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != ''
        run: npx --yes @vscode/vsce@4 publish --azure-credential --packagePath ./*.vsix --skip-duplicate
      - name: Report Marketplace setup requirement
        if: env.AZURE_CLIENT_ID == '' || env.AZURE_TENANT_ID == ''
        run: |
          echo "::notice::VSIX released on GitHub; Marketplace publishing needs a federated Entra ID publisher."
          echo "Marketplace was not published. Configure AZURE_CLIENT_ID and AZURE_TENANT_ID after granting the federated application publisher access." >> "$GITHUB_STEP_SUMMARY"
