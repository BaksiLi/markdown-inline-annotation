name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      existing_release:
        description: "Resume registry publishing from an existing public release (current shared version)"
        type: string
        required: false

concurrency:
  group: release-${{ inputs.existing_release || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.existing_release || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify shared version and tag
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          assert.match(process.env.RELEASE_TAG, /^\d+\.\d+\.\d+$/);
          assert.equal(process.env.RELEASE_TAG, pkg.version);
          if (process.env.GITHUB_EVENT_NAME !== "workflow_dispatch" || !process.env.RESUME_RELEASE) {
            assert.equal(process.env.GITHUB_REF_TYPE, "tag");
          }
          NODE
        env:
          RESUME_RELEASE: ${{ inputs.existing_release }}
      - run: npm ci
      - run: npm run check
        if: inputs.existing_release == ''
      - run: npm run release:pack
        if: inputs.existing_release == ''
      - name: Download the original public release
        if: inputs.existing_release != ''
        run: node scripts/download-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify the original published artifacts
        if: inputs.existing_release != ''
        run: npm run release:verify -- --published
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: artifacts/*
          if-no-files-found: error
          overwrite: true

  github:
    needs: build
    if: inputs.existing_release == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: artifacts
      - run: npm run release:publish
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/attest@v4
        with:
          subject-path: artifacts/*

  npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: artifacts
      - run: node scripts/publish-npm.mjs

  marketplace:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: artifacts
      - name: Publish verified VSIX
        run: npx --yes @vscode/vsce@4.1.1 publish --oidc --packagePath artifacts/*.vsix --skip-duplicate
      - name: Report publishing failure
        if: failure()
        run: |
          echo "Marketplace: not published. Check the failed step and the baksili publisher's Trusted Publishing policy for BaksiLi/markdown-inline-annotation, release.yml." >> "$GITHUB_STEP_SUMMARY"
